<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Violinoscope</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="app.css">
</head><body>
<div class="app" id="app">
  <main class="stage" id="stage">
    <div class="view" id="violins">
      <svg class="layer" id="v-under" aria-hidden="true"></svg>
      <canvas class="layer" id="v-dots" aria-hidden="true"></canvas>
      <svg class="layer" id="v-over" role="img" data-u aria-label="Each violin's time in every {unit} span, one dot per span, with the tree of violins below"></svg>
      <canvas class="layer" id="v-heat" aria-hidden="true"></canvas>
      <canvas class="layer" id="v-hover" aria-hidden="true"></canvas>
      <div class="hitpad" id="hitpad"></div>
      <div id="v-factors"></div>
      <button type="button" class="whatif-pill" id="v-whatif" data-pill="0" hidden>×1</button>
      <div class="seg factor-menu" id="v-factor-menu" role="group" hidden></div>
      <button type="button" class="hide-x" id="v-hide" hidden>×</button>
      <div class="add-menu" id="v-add" role="dialog" aria-label="Add violins" hidden></div>
      <div class="add-menu move-menu" id="v-move" role="dialog" aria-label="Move violin" hidden></div>
      <div class="merge-bar" id="v-merge" role="group" aria-label="Merge the picked violins" hidden></div>
    </div>
    <div class="view" id="flame" hidden><canvas id="flame-canvas" role="img" aria-label="Spans stacked: where they ran, or merged heaviest first"></canvas></div>
    <div class="view list" id="timeline" hidden></div>
    <div class="view list" id="spans" hidden><div id="spans-body"></div></div>

    <div class="controls" id="controls">
      <div class="row">
        <div class="seg" id="views" role="group" aria-label="View">
          <button type="button" data-tab="violins" aria-pressed="true" data-u title="Where the time of a {unit} span goes: which spans under it take it, and how that varies across them and workloads">Phases</button>
          <button type="button" data-tab="timeline" aria-pressed="false" data-u title="What happened in each {unit} span, span by span, where it ran">Timeline</button>
          <button type="button" data-tab="profile" aria-pressed="false" data-u title="Which spans cost the most, summed over every {unit} span in view or over the one selected">Spans</button>
        </div>
        <div class="seg" id="modes" role="group" aria-label="Measure" data-for="violins">
          <button type="button" data-mode="share" aria-pressed="true" data-u title="Share of each {unit} span's time (1)">Share</button>
          <button type="button" data-mode="ms" aria-pressed="false" title="Milliseconds (2)">Time</button>
        </div>
        <div class="seg" id="scales" role="group" aria-label="Scale" data-for="violins">
          <button type="button" data-linear="false" aria-pressed="true" title="Square root: spreads out the small shares, and still shows 0% (L)">Square root</button>
          <button type="button" data-linear="true" aria-pressed="false" title="Linear (L)">Linear</button>
        </div>
        <div class="seg" id="tl-modes" role="group" aria-label="Timeline" data-for="timeline" hidden>
          <button type="button" data-tl="chart" aria-pressed="true" data-u title="Each {unit} span on one line, what it calls stacked below, asynchronous spans on a track per name">Flame chart</button>
          <button type="button" data-tl="waterfall" aria-pressed="false" title="A row per span, as in Jaeger">Waterfall</button>
        </div>
        <div class="seg" id="prof-modes" role="group" aria-label="Spans" data-for="profile" hidden>
          <button type="button" data-prof="table" aria-pressed="true" title="Every span name, or every call path, with its self and total time; pick one for its callers and callees">Table</button>
          <button type="button" data-prof="flame" aria-pressed="false" title="Spans with the same path merged, heaviest first">Flame graph</button>
          <button type="button" data-prof="callers" aria-pressed="false" title="The picked span: what calls it, and what it calls" hidden>Callers &amp; callees</button>
        </div>
        <div class="seg" id="table-modes" role="group" aria-label="Rows" data-for="profile" data-for-prof="table" hidden>
          <button type="button" data-tree="false" aria-pressed="true" title="A row per span name">List</button>
          <button type="button" data-tree="true" aria-pressed="false" title="A row per call path, merged as in the flame graph; sorting sorts each level">Tree</button>
        </div>
      </div>
      <div class="filters">
        <div class="legend" id="legend"></div>
        <div class="chips">
          <span class="chip-group" id="name-chip" hidden><button class="chip" id="name-text" type="button"></button><button class="chip-x" id="name-clear" type="button" aria-label="Let the span go" title="Let the span go (Esc)">×</button></span>
          <span class="chip-group sel-chip" id="sel-chip" hidden></span>
          <span class="chip-group" id="whatif-chip" hidden><span class="chip" id="whatif-text"></span><button class="chip-x" id="whatif-clear" type="button" aria-label="Turn the what-if off" title="Turn the what-if off: every part as measured">×</button></span>
          <button class="range-chip" id="range-chip" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="rangecard"><span data-u>{unit} time</span><b id="range-value">all</b></button>
          <button class="range-clear" id="range-clear" type="button" aria-label="Show every duration" title="Show every duration" hidden>×</button>
          <button class="quiet-btn" id="picture" type="button" data-for="violins" disabled aria-label="Save the violins as an image" title="Save the violins as an image (PNG)"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 10.5 7 8l2 1.8 1.5-1.3 1.5 2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10.4" cy="6.2" r="0.9" fill="currentColor"/></svg></button>
          <button class="quiet-btn" id="layouts" type="button" disabled aria-label="Layouts" aria-haspopup="dialog" aria-expanded="false" aria-controls="layout-menu" title="Layouts"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M7 3v10M7 7h6" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
          <button class="quiet-btn" id="download" type="button" disabled aria-label="Download this page as one file" title="Download this page as one HTML file, data and all, opening with these violins"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 2.5v8M4.5 7 8 10.5 11.5 7M3 13.5h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
      </div>
    </div>

    <div class="overview" id="overview" hidden><canvas id="overview-canvas" aria-label="Overview" title="Drag to pick a stretch to show, or an edge of it to move that edge; double-click or F for all of it"></canvas><div class="ov-nav" id="ov-nav" hidden><button type="button" data-nav="all" title="All of it (F, or double-click the strip); Esc goes back to where you were">All</button></div></div>
    <div id="layout-menu" class="layout-menu" role="dialog" aria-label="Layouts" hidden></div>
    <input type="file" id="layout-file" accept=".json,application/json" hidden>
    <div class="toast" id="toast" role="status" hidden></div>

    <section class="card" id="rangecard" role="dialog" data-u aria-label="{unit} time range" hidden>
      <div class="card-head">
        <span class="card-title" data-u>{unit} time</span>
        <span class="range-inputs">
          <input id="range-lo" inputmode="decimal" aria-label="Shortest, ms">
          <span>–</span>
          <input id="range-hi" inputmode="decimal" aria-label="Longest, ms">
          <span class="unit">ms</span>
        </span>
        <button class="text-btn small" id="range-all" type="button" title="Every duration (double-click the histogram)">All</button>
        <span class="spacer"></span>
      </div>
      <svg id="range-svg" data-u aria-label="Histogram of {unit} times: drag the handles or across it to pick a range, double-click to show all"></svg>
      <div class="dom-legend" id="dom-legend" hidden></div>

      <div class="card-cross" id="card-cross" hidden></div>
    </section>

    <div class="card-pop" id="card-pop" role="dialog" aria-label="Part" hidden></div>
    <div class="tip" id="tip" hidden><div class="t1"></div><div class="k"></div><div></div><div class="k"></div><div class="k"></div></div>
  </main>

  <section class="about" id="keys" aria-label="Keyboard" hidden></section>
</div>
<script src="render.js"></script>
<script src="model.js"></script>
<script src="data/summary.js"></script>
<script src="data/layout.js"></script>
<script src="core.js"></script>
<script src="flows.js"></script>
<script src="layout.js"></script>
<script src="gl.js"></script>
<script src="violins.js"></script>
<script src="edit.js"></script>
<script src="download.js"></script>
<script src="layout-files.js"></script>
<script src="layout-menu.js"></script>
<script src="nav.js"></script>
<script src="flame-view.js"></script>
<script src="parts.js"></script>
<script src="flame.js"></script>
<script src="spans.js"></script>
<script src="timeline.js"></script>
<script src="panel.js"></script>
<script src="main.js"></script>
</body></html>
